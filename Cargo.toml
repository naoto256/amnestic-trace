[package]
name = "amt"
version = "0.2.0"
edition = "2021"
description = "Amnestic Trace: ephemeral replacement memory across a context boundary"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
