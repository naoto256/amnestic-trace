[package]
name = "amtr"
version = "0.1.3"
edition = "2024"
description = "Ephemeral replacement memory across a context boundary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/naoto256/amnestic-trace"
# Distributed as a plugin and a built binary, never from crates.io. Stated so a
# stray `cargo publish` fails instead of succeeding.
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
