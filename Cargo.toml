[package]
name = "amtr"
version = "0.2.0"
edition = "2021"
description = "Ephemeral replacement memory across a context boundary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/naoto256/amnestic-trace"

# Named `amtr`, not `amt`: macOS ships a root-owned /usr/sbin/amt that wins on a
# default PATH. Nothing types this by hand — the callers are hooks.

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
